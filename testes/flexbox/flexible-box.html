<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de flexbox</title>
    <link rel="stylesheet" href="estilo/style.css">

</head>
<body>
    <main>
        <div id="container">
            <div id="header-login">
                <h1>Página de Login</h1>
            </div>
            <form action="cadastro.php" method="post">
                <div id="email-input" class="input-login">
                    <label for="iemail">E-mail</label>
                    <input type="email" name="email" id="iemail" required maxlength="30" placeholder="Digite seu @mail.com">
                </div>
                <div id="senha-input">
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" required minlength="8" maxlength="30" placeholder="Digite sua senha">
                </div>
                <button type="submit">Enviar</button>
                <a href="#">
                    <p>Esqueceu sua senha?</p>
                </a>
            </form>
        </div>
    </main>
</body>
</html>
