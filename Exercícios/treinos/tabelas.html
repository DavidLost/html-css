<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes com tabelas</title>
    <style>
          table {
            border: 1px solid black;
            width: 400px;
            height: 200px;
            border-collapse: collapse;
          }

          td {
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            background-color: gray;
            vertical-align: middle;
          }
          
          th {
            background-color: darkcyan;
            border: 1px solid black;
          }

          
          
    </style>
</head>
<body>
    <table>
        <tr>
            <th>B1</th>
            <td>A2</td>
            <td>A3</td>
            <td>A4</td>
            <td>A5</td>
        </tr>
        <tr>
            <th>B1</th>
            <td>B2</td>
            <td>B3</td>
            <td>B4</td>
            <td>B5</td>
        </tr>
    </table>
</body>
</html>
