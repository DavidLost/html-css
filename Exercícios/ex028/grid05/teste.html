<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando layout com grid</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;

        }

        .container {
            height: 100vh;
            display: grid;
            grid-template: repeat(4, 1fr) 100px / repeat(5, 2fr);
            gap: 10px;
            
            
        }

        .header {
            background-color: rgba(0, 0, 0, 0.527);
            
            grid-area: 1/1 / 2/-1;
            
        }

        .main {
            background-color: cyan;
            grid-column: 2/5;
            grid-row: 2/4;
            grid-area: 2/2 / 4/5;
            
        }

        .aside {
            background-color: green;
            
            grid-area: 2/1 / 4/2;

        }

        #iaside {
            background-color: lightgreen;
            
            grid-area: 2/5 / -3/-1;
            
        }

        .footer {
            background-color: orange;
            
            grid-area: 4/1 / -2/-1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">header</div>
        <div class="main">main</div>
        <div class="aside">aside</div>
        <div id="iaside">aside</div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
