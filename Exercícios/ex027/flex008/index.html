<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner {
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            background-color: lightsalmon;
            height: 400px;
            width: 350px;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#iA {
            align-self: flex-start;
        }

         div#iB {
            align-self: auto;
         }

         div#iC {
            align-self: flex-end;
         }

         div#iD {
            align-self: flex-start
         }

         div#iE {
            align-self: center;
         }

         div#iF {
            align-self: flex-start;
         }  

         div#iG {
            align-self: stretch;
         }


    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="iA">A</div>
        <div class="item" id="iB">B</div>
        <div class="item" id="iC">C</div>
        <div class="item" id="iD">D</div>
        <div class="item" id="iE">E</div>
        <div class="item" id="iF">F</div>
        <div class="item" id="iG">G</div>
    </div>
</body>
</html>
